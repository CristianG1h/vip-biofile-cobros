services:
  - type: web
    name: vip-biofile-cobros
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HEADLESS
        value: "true"
      - key: TIMEZONE
        value: America/Bogota
      - key: WEEKLY_DAY
        value: "0"
      - key: WEEKLY_RECOVERY_DAYS
        value: "7"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_HOUR
        value: "18"
      - key: SCHEDULER_MINUTE
        value: "0"
      - key: SCHEDULER_RETRY_MINUTES
        value: "15"
      - key: BIOFILE_ESTADO_CUENTAS_URL
        value: https://vipso.biofile.com.co/Factura/EstadoCuentas.aspx
      - key: BIOFILE_LOGIN_URL
        value: https://vipso.biofile.com.co/IniciarSesion.aspx?ReturnUrl=%2f
      - key: BIOFILE_USUARIO
        sync: false
      - key: BIOFILE_CONTRASENA
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_TOKEN
        sync: false
      - key: SERVICE_API_KEY
        sync: false
